version: '3.9'

services:
  # PostgreSQL - Main database for ledger, tenants, and audit logs
  postgres:
    image: postgres:16-alpine
    container_name: ledgerline-postgres
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline_dev_password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerline

  # Redis Cluster - State management, locks, and outbox
  redis:
    image: redis:7-alpine
    container_name: ledgerline-redis
    command: redis-server --requirepass ledgerline_redis_password --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ledgerline

  # RabbitMQ - Quorum queues for reliable message processing
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ledgerline-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ledgerline
      RABBITMQ_DEFAULT_PASS: ledgerline_rabbit_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerline

  # Qdrant - Vector database for semantic cache
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ledgerline-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    networks:
      - ledgerline

  # Kong Gateway - API gateway with rate limiting
  kong-database:
    image: postgres:16-alpine
    container_name: ledgerline-kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong_password
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerline

  kong-migration:
    image: kong/kong:3.9.3
    container_name: ledgerline-kong-migration
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PG_DATABASE: kong
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - ledgerline

  kong:
    image: kong/kong:3.9.3
    container_name: ledgerline-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong_password
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_PLUGINS: bundled,rate-limiting,request-termination,correlation-id
    ports:
      - "8000:8000"   # Proxy HTTP
      - "8443:8443"   # Proxy HTTPS
      - "8001:8001"   # Admin API HTTP
      - "8444:8444"   # Admin API HTTPS
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledgerline

  # Rate Limiter Service (Go)
  rate-limiter:
    build:
      context: ./backend/services/go/rate-limiter
      dockerfile: Dockerfile
    container_name: ledgerline-rate-limiter
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ledgerline_redis_password
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ledgerline

  # DLQ Handler Service (Go)
  dlq-handler:
    build:
      context: ./backend/services/go/dlq-handler
      dockerfile: Dockerfile
    container_name: ledgerline-dlq-handler
    environment:
      DATABASE_URL: "postgres://ledgerline:ledgerline_dev_password@postgres:5432/ledgerline?sslmode=disable"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ledgerline_redis_password
      RABBITMQ_URL: "amqp://ledgerline:ledgerline_rabbit_password@rabbitmq:5672/"
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ledgerline

  # Dispatcher Service (Python FastAPI)
  dispatcher:
    build:
      context: ./backend/services/python/dispatcher
      dockerfile: Dockerfile
    container_name: ledgerline-dispatcher
    environment:
      DATABASE_URL: "postgres://ledgerline:ledgerline_dev_password@postgres:5432/ledgerline?sslmode=disable"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ledgerline_redis_password
      RABBITMQ_URL: "amqp://ledgerline:ledgerline_rabbit_password@rabbitmq:5672/"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ledgerline

  # Streaming Dispatcher Service (Go)
  streaming-dispatcher:
    build:
      context: ./backend/services/go/streaming-dispatcher
      dockerfile: Dockerfile
    container_name: ledgerline-streaming-dispatcher
    environment:
      DATABASE_URL: "postgres://ledgerline:ledgerline_dev_password@postgres:5432/ledgerline?sslmode=disable"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ledgerline_redis_password
      PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ledgerline

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: ledgerline-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ledgerline

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ledgerline-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - ledgerline

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ledgerline-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "6831:6831/udp" # Jaeger agent
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - ledgerline

volumes:
  postgres_data:
  kong_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  ledgerline:
    driver: bridge
